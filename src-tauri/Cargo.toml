[package]
name = "matekos-doksi"
version = "0.8.0"
description = "Matekos Doksi – WYSIWYG editor for print-ready documents with live TeX"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "matekos_doksi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-fs = "~2.5"
tauri-plugin-opener = "~2.5"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
