# Builds the Windows installer (setup wizard) and the macOS app (.dmg) on GitHub's
# computers and publishes them on the repository's "Releases" page.
# Start it from the "Actions" tab: Build installers → Run workflow.
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Matekos Doksi v__VERSION__'
          releaseBody: |
            **Windows:** töltsd le a `..._x64-setup.exe` fájlt, és kattints rá duplán.
            Ha megjelenik a „Windows megvédte a számítógépet” ablak: További információ → Futtatás mindenképp.

            **Mac:** töltsd le a `..._universal.dmg` fájlt, nyisd meg, és húzd a Matekos Doksi ikont az Alkalmazások mappába.
            Első indításkor: Rendszerbeállítások → Adatvédelem és biztonság → „Megnyitás mindenképp”.

            ---
            **Windows:** download `..._x64-setup.exe` and double-click it. If "Windows protected your PC" appears: More info → Run anyway.
            **Mac:** open the `..._universal.dmg` and drag Matekos Doksi into Applications. On first launch: System Settings → Privacy & Security → "Open Anyway".
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
